<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    <picture>
      <source type="image/jpeg"  media="(max-width: 960px)" srcset="images/landscape/museum-320x.jpg 320w, images/landscape/museum-480x.jpg 480w, images/landscape/museum-640x.jpg 640w, images/landscape/museum-720x.jpg 720w, images/landscape/museum-960x.jpg 960w, images/landscape/museum-1440x.jpg 1440w, images/landscape/museum-1920x.jpg 1920w, images/landscape/museum-2160x.jpg 2160w, images/landscape/museum-2880x.jpg 2880w" 
      sizes="100vw">
      <source type="image/jpeg" media="(min-width: 961px)" srcset="images/square/museum-480x.jpg 480w, images/square/museum-640x.jpg 640w, images/square/museum-800x.jpg 800w, images/square/museum-960x.jpg 960w, images/square/museum-1280x.jpg 1280w, images/square/museum-1440x.jpg 1440w, images/square/museum-1600x.jpg 1600w, images/square/museum-1920x.jpg 1920w, images/square/museum-2400x.jpg 2400w" 
      sizes="100vw">
      <img src="images/landscape/museum-320x.jpg" alt="Art Museum exhibition of religious art"/>
    </picture>
  </header>
</body>

</html>
